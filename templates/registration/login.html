{% extends 'base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-10 border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">로그인</h2>
            <p class="text-gray-500 mt-2 font-medium">김씨네 대가족 가계부</p>
        </div>

        <form method="post" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}

            {% if form.errors %}
            <div
                class="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-semibold border border-red-100 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                이메일 혹은 비밀번호가 일치하지 않습니다.
            </div>
            {% endif %}

            <!-- Django의 기본 로그인 뷰는 인증을 위해 name="username"을 찾습니다. CustomUser가 email을 기반으로 해도 마찬가지입니다. -->
            <div>
                <label for="id_username" class="block text-sm font-bold text-gray-700 mb-2">이메일 주소</label>
                <input type="email" name="username" id="id_username" required autofocus
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition duration-200"
                    placeholder="example@email.com">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-bold text-gray-700 mb-2">비밀번호</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition duration-200"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-200 transition transform hover:-translate-y-0.5 mt-4">
                로그인
            </button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <div class="mt-8 border-t border-gray-100 pt-6 text-center">
            <p class="text-sm text-gray-500">
                계정이 없으신가요? 
                <a href="{% url 'accounts:signup' %}" class="text-indigo-600 font-bold hover:text-indigo-800 transition underline decoration-2 underline-offset-4">회원가입 하기</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
